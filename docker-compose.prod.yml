# Production Docker Compose — runs the full Veris stack on a single VPS.
#
# Usage:
#   cp .env.production.example .env.production
#   # Fill in API keys and passwords
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Architecture:
#   nginx (:80/:443/:8443) → frontend (:3000) + agent (:8080) + openemr (:80)
#   mariadb (:3306) — internal only, not exposed to the internet

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    command: ['mariadbd', '--character-set-server=utf8mb4']
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openemr}
      MYSQL_USER: ${MYSQL_USER:-openemr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--su-mysql', '--connect', '--innodb_initialized']
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    networks:
      - veris-net

  openemr:
    build:
      context: .
      dockerfile: Dockerfile.openemr
    restart: unless-stopped
    command: ['./railway-entrypoint.sh']
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: '3306'
      MYSQL_USER: ${MYSQL_USER:-openemr}
      MYSQL_PASS: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openemr}
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASSWORD}
      OE_USER: ${OE_USER:-admin}
      OE_PASS: ${OE_PASS}
      OPENEMR_SETTING_site_addr_oath: https://${DOMAIN}:8443
      OPENEMR_SETTING_oauth_password_grant: 3
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_rest_system_scopes_api: 1
      OPENEMR_SETTING_veris_agent_url: https://${DOMAIN}
    networks:
      - veris-net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      openemr:
        condition: service_started
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENEMR_BASE_URL: http://openemr:80
      OPENEMR_CLIENT_ID: ${OPENEMR_CLIENT_ID:-}
      OPENEMR_CLIENT_SECRET: ${OPENEMR_CLIENT_SECRET:-}
      OPENEMR_USERNAME: ${OE_USER:-admin}
      OPENEMR_PASSWORD: ${OE_PASS}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN},https://${DOMAIN}:8443
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      PORT: '8080'
    networks:
      - veris-net

  frontend:
    build:
      context: ./agent/frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGENT_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_AGENT_API_URL: https://${DOMAIN}/api
    networks:
      - veris-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '8443:8443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - openemr
      - agent
      - frontend
    networks:
      - veris-net

volumes:
  db_data:

networks:
  veris-net:
    driver: bridge
