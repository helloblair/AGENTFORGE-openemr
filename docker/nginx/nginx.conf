worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Upstream services
    upstream frontend {
        server frontend:3000;
    }

    upstream agent {
        server agent:8080;
    }

    upstream openemr {
        server openemr:80;
    }

    # ── Redirect HTTP to HTTPS ───────────────────────────────────────
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── Port 443: Frontend + Agent API ───────────────────────────────
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Agent API — strip /api prefix and proxy to FastAPI
        location /api/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://agent;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support streaming / long-running agent responses
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Everything else → Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js HMR / WebSocket support (dev convenience)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── Port 8443: OpenEMR (separate port — OpenEMR can't run under a sub-path)
    server {
        listen 8443 ssl;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://openemr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;

            # OpenEMR file uploads
            client_max_body_size 50m;
            proxy_read_timeout 120s;
        }
    }
}
